# MediaMTX handles ingest only. Fan-out and recording are separate consumer
# processes (one NSSM service each; see relay/config.py), so nothing here
# pushes or records.
#
# Values that come from .env are set by environment variables on the
# mediamtx service (relay.config.Config.mediamtx_env), not here: MediaMTX
# does not expand variables in this file.
#   MTX_RTMPADDRESS   :<RTMP_PORT>
#   MTX_APIADDRESS    127.0.0.1:<RELAY_API_PORT>
#   MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH   live/<INGEST_KEY>

logLevel: info
logDestinations: [stdout]

# Packets queued per reader before MediaMTX drops it as "too slow". A
# transcoding output takes ~10s to start (CUDA and NVENC init, input probe)
# before it reads at full speed; at the 30 Mbps 1080p60 master (~110
# packets/s) the default 512 overflowed in ~5s, and every output was dropped
# and reconnected through the first 15s of go-live (shrike acceptance run,
# 2026-10-06). 4096 is ~35s of headroom, ~130 MB per reader at worst; a
# reader that starts late now begins behind live and catches up instead.
# Must be a power of two.
writeQueueSize: 4096

# Ingest is RTMP only. Every other protocol is off.
rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"
rtsp: false
hls: false
webrtc: false
srt: false
moq: false

# Consumers and the status glue poll this to see whether ingest is live.
# Loopback only: they all run on this host.
api: true
apiAddress: 127.0.0.1:9997

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      # Publishing is allowed on exactly one path: live/<INGEST_KEY>. OBS
      # sends server rtmp://<relay host>/live plus the key, so the key is the
      # last path segment and a wrong key is rejected.
      #
      # The real value comes from MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH.
      # The index is positional: keep this entry first in this list, and this
      # list first in the users.
      - action: publish
        path: live/unset-ingest-key-see-relay-config
      - action: read
      - action: api

paths:
  all_others:
